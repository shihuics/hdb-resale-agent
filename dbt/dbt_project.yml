name: hdb
version: "1.0"
profile: hdb
model-paths: ["models"]
test-paths: ["tests"]
seed-paths: ["seeds"]
models:
  hdb:
    staging:
      +materialized: view
    marts:
      +materialized: table
seeds:
  hdb:
    block_coords:
      +column_types:
        block: varchar
        street_name: varchar
        postal: varchar
        latitude: double
        longitude: double
        match: varchar
    mrt_exits:
      +column_types:
        station: varchar
        exit_code: varchar
        latitude: double
        longitude: double
        is_lrt: boolean