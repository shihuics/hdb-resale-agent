name: refresh-data
on:
  schedule:
    - cron: "17 1 * * *"   # 09:17 SGT daily
  workflow_dispatch:
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - id: fresh
        run: python ingest/check_freshness.py
      - name: Rebuild
        if: steps.fresh.outputs.changed == 'true' || github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python ingest/download.py
          dbt build --project-dir dbt --profiles-dir dbt
          gh release view data-latest || gh release create data-latest --title "Latest data" --notes "Auto-built HDB resale DuckDB"
          gh release upload data-latest hdb.duckdb --clobber
      - name: Save state
        if: steps.fresh.outputs.changed == 'true'
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add state/last_updated.txt
          git commit -m "Data refreshed" && git push
